<div class="container py-5">
  <!-- Main Card -->
  <div class="card shadow-lg border-0 rounded-4">
    <h2 class="text-center text-primary mb-4">Expense Tracker</h2>
    
    <!-- Expense Form -->
    <form (ngSubmit)="addExpense()" class="row g-3">
      <div class="col-md-3">
        <label for="amount" class="form-label">Amount</label>
        <input id="amount" type="number" [(ngModel)]="amount" name="amount" class="form-control" placeholder="₹ Amount" required>
      </div>
      <div class="col-md-3">
        <label for="category"  class="form-label">Category</label>
        <select name="category" class="form-control" id="category" [(ngModel)]="category" required>
          <option value="Grocery">Grocery</option>
          <option value="Fast-Food">Fast-Food</option>
          <option value="Travel">Travel</option>
          <option value="Train-Travel">Train-Travel</option>
          <option value="Electronics Accessories">Electronics Accessories</option>
          <option value="Clothes">Clothes</option>
          <option value="Mobile-Recharge">Mobile-Recharge</option>
          <option value="Repayment">Repayment</option>
          <option value="Others">Others</option>
        </select>
        <!-- <input id="category" type="text" [(ngModel)]="category" name="category" class="form-control" placeholder="e.g. Travel, Grocery" required> -->
      </div>
      <div class="col-md-3">
        <label for="note" class="form-label">Note</label>
        <input id="note" type="text" [(ngModel)]="note" name="note" class="form-control" placeholder="Optional">
      </div>
      <div class="col-md-2">
        <label for="date" class="form-label">Date</label>
        <input id="date" type="date" [(ngModel)]="date" name="date" class="form-control">
      </div>
      <div class="col-md-1 d-flex align-items-end">
        <button type="submit" class="btn btn-success w-100">Add Expense</button>
      </div>
    </form>
  </div>

  <!-- All Expenses -->
  <div class="row mt-4">

    <!-- Category Summary -->
    <div class="col-lg-6 col-md-12">
      <div class="card shadow-lg rounded-4 mt-3">
        <h5 class="card-header bg-info text-white">Category Summary</h5>
        <ul class="list-group list-group-flush">
          <li *ngFor="let cat of summary" class="list-group-item d-flex justify-content-between align-items-center">
            <div>{{ cat.category }}</div>
            <div class="badge bg-success">₹{{ cat.total }}</div>
          </li>
        </ul>
      </div>
    </div>

    
    
    <div class="col-lg-6 col-md-12">
      <div class="card shadow-lg rounded-4 mt-3">
        <button class="btn btn-secondary mb-3" (click)="downloadCSV()">Download CSV</button>
        <h5 class="card-header bg-primary text-white">All Expenses</h5>
        <ul class="list-group list-group-flush">
          <li *ngFor="let e of expenses" class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <strong>{{ e.date }}</strong><br>
              ₹{{ e.amount }} | {{ e.category }}
            </div>
            <small class="text-muted">{{ e.note || 'No note' }}</small>
          </li>
        </ul>
      </div>
    </div>
    
  </div>
</div>

<div style="display: flex;justify-content: center;">
  <button class="btn btn-danger mb-3" (click)="deleteData()">Delete Complate Data</button>

</div>
